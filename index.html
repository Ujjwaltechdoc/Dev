    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis AI - Image Classifier</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- TensorFlow.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <!-- MobileNet Pre-trained Model -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        #image-preview {
            max-height: 300px;
            display: none;
        }
        .loading-spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #fff;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <div class="gradient-bg text-white py-10 px-4 text-center shadow-lg">
        <h1 class="text-4xl font-bold mb-2">Jarvis AI Model</h1>
        <p class="text-lg opacity-90">HTML, CSS aur JS se bana Image Classifier</p>
    </div>

    <main class="max-w-2xl mx-auto mt-10 p-6 bg-white rounded-xl shadow-md">
        
        <!-- Status Box -->
        <div id="status-box" class="mb-6 p-4 rounded-lg bg-blue-50 text-blue-700 flex items-center gap-3">
            <div id="loader" class="loading-spinner" style="border-top-color: #1d4ed8;"></div>
            <span id="status-text">AI Model load ho raha hai, kripya intezar karein...</span>
        </div>

        <!-- Image Upload Section -->
        <div class="flex flex-col items-center">
            <div class="w-full mb-6 border-2 border-dashed border-gray-300 rounded-lg p-4 flex flex-col items-center justify-center bg-gray-50">
                <img id="image-preview" src="#" alt="Preview" class="rounded-lg shadow-sm mb-4 border border-gray-200">
                
                <label class="cursor-pointer bg-purple-600 hover:bg-purple-700 text-white px-6 py-2 rounded-full transition duration-300">
                    Image Select Karein
                    <input type="file" id="image-input" accept="image/*" class="hidden">
                </label>
                <p class="text-gray-500 text-sm mt-2">Koi bhi photo upload karein (Jaise: Kutta, Billi, Car, Mobile)</p>
            </div>

            <!-- Analysis Button -->
            <button id="classify-btn" disabled class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-lg shadow-lg disabled:bg-gray-400 disabled:cursor-not-allowed transition duration-300 flex justify-center items-center gap-2">
                <span>AI se Check Karein</span>
            </button>

            <!-- Results Section -->
            <div id="result-container" class="mt-8 w-full hidden">
                <h2 class="text-xl font-bold mb-4 border-b pb-2">AI Results:</h2>
                <div id="prediction-list" class="space-y-3">
                    <!-- Predictions will appear here -->
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center mt-10 text-gray-500 pb-10">
        <p>Banaaya gaya Jarvis ke liye | TensorFlow.js ka upyog karke</p>
    </footer>

    <script>
        let model = undefined;
        const statusText = document.getElementById('status-text');
        const loader = document.getElementById('loader');
        const imageInput = document.getElementById('image-input');
        const imagePreview = document.getElementById('image-preview');
        const classifyBtn = document.getElementById('classify-btn');
        const resultContainer = document.getElementById('result-container');
        const predictionList = document.getElementById('prediction-list');

        // 1. AI Model Load Karna
        async function loadModel() {
            try {
                // MobileNet load kar rahe hain
                model = await mobilenet.load();
                statusText.innerText = "AI Model Taiyar Hai! Ab image upload karein.";
                loader.style.display = "none";
                document.getElementById('status-box').classList.replace('bg-blue-50', 'bg-green-50');
                document.getElementById('status-box').classList.replace('text-blue-700', 'text-green-700');
            } catch (error) {
                statusText.innerText = "Model load karne mein galti hui. Kripya page refresh karein.";
                console.error(error);
            }
        }

        // 2. Image Preview Handle Karna
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    imagePreview.src = event.target.result;
                    imagePreview.style.display = 'block';
                    classifyBtn.disabled = false;
                    resultContainer.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        // 3. AI Prediction (Main Logic)
        classifyBtn.addEventListener('click', async () => {
            if (!model) return;

            classifyBtn.innerHTML = '<div class="loading-spinner"></div> Scanning...';
            classifyBtn.disabled = true;

            // Model image ko scan karega
            const predictions = await model.classify(imagePreview);
            
            displayResults(predictions);
            
            classifyBtn.innerHTML = '<span>AI se Check Karein</span>';
            classifyBtn.disabled = false;
        });

        // 4. Results Dikhana
        function displayResults(predictions) {
            predictionList.innerHTML = '';
            resultContainer.classList.remove('hidden');

            predictions.forEach(p => {
                const percentage = Math.round(p.probability * 100);
                const itemDiv = document.createElement('div');
                itemDiv.className = "flex items-center justify-between bg-gray-50 p-3 rounded-lg border-l-4 border-purple-500";
                
                itemDiv.innerHTML = `
                    <span class="font-semibold text-gray-700 capitalize">${p.className}</span>
                    <span class="bg-purple-100 text-purple-700 px-3 py-1 rounded-full text-sm font-bold">${percentage}% Sahi Hone Ka Chance</span>
                `;
                predictionList.appendChild(itemDiv);
            });

            // Scroll to results
            resultContainer.scrollIntoView({ behavior: 'smooth' });
        }

        // App start karein
        window.onload = loadModel;
    </script>
</body>
</html>
