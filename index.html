
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Skulpt - Ultra Fast Python Web Studio</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Monaco Code Editor CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/editor/editor.main.min.css" />

  <!-- Skulpt Core & Standard Libraries (~200KB Ultra-Lightweight JS Engine) -->
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    button, select {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex flex-col overflow-hidden">

  <!-- TOP NAVBAR -->
  <header class="bg-slate-900 border-b border-slate-800 px-3 py-2 flex flex-wrap items-center justify-between gap-2 shrink-0 z-20">
    <div class="flex items-center space-x-2">
      <div class="flex items-center space-x-2 text-sky-400 font-bold text-base md:text-lg">
        <i class="fa-brands fa-python text-sky-400 text-xl"></i>
        <span>Skulpt Studio</span>
      </div>
      <span class="hidden sm:inline-block text-[10px] bg-sky-950/80 text-sky-300 border border-sky-700/50 px-2 py-0.5 rounded-full font-mono">
        Ultra-Fast Engine (~200KB)
      </span>
    </div>

    <!-- Controls Toolbar -->
    <div class="flex items-center space-x-2 overflow-x-auto no-scrollbar py-0.5 max-w-full">
      <!-- Snippets Selector -->
      <select id="snippet-select" aria-label="Select Python Template" class="bg-slate-800 text-slate-200 text-xs rounded-lg border border-slate-700 px-2.5 py-1.5 focus:outline-none focus:border-sky-500 cursor-pointer">
        <option value="hello">Hello Python</option>
        <option value="loops">Loops & Math</option>
        <option value="functions">Functions & Lists</option>
        <option value="turtle">Turtle Graphics Demo</option>
      </select>

      <!-- Theme Selector -->
      <select id="theme-select" aria-label="Select Theme" class="bg-slate-800 text-slate-200 text-xs rounded-lg border border-slate-700 px-2.5 py-1.5 focus:outline-none focus:border-sky-500 cursor-pointer hidden sm:block">
        <option value="vs-dark">Dark Theme</option>
        <option value="vs-light">Light Theme</option>
        <option value="hc-black">High Contrast</option>
      </select>

      <!-- Mobile View Switcher Tabs -->
      <div class="flex lg:hidden bg-slate-800 p-0.5 rounded-lg border border-slate-700 text-xs">
        <button id="tab-code" onclick="switchMobileTab('code')" class="px-2.5 py-1 rounded-md bg-sky-600 text-white font-medium transition">Code</button>
        <button id="tab-output" onclick="switchMobileTab('output')" class="px-2.5 py-1 rounded-md text-slate-400 hover:text-white transition">Output</button>
      </div>

      <!-- Export Button -->
      <button onclick="downloadCode()" title="Download Code" class="shrink-0 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-2.5 py-1.5 rounded-lg border border-slate-700 transition flex items-center space-x-1">
        <i class="fa-solid fa-download"></i>
        <span class="hidden md:inline">Export</span>
      </button>

      <!-- Run Button -->
      <button id="run-btn" onclick="runSkulptPython()" class="bg-sky-600 hover:bg-sky-500 text-white font-semibold text-xs px-3.5 py-1.5 rounded-lg shadow-md transition flex items-center space-x-1.5 border border-sky-500/40 cursor-pointer shrink-0">
        <i id="run-icon" class="fa-solid fa-play text-[10px]"></i>
        <span id="run-text">Run</span>
      </button>
    </div>
  </header>

  <!-- MAIN WORKSPACE -->
  <div class="flex-1 flex flex-col lg:flex-row overflow-hidden relative">
    
    <!-- LEFT PANEL: MONACO EDITOR -->
    <div id="panel-editor" class="w-full lg:w-1/2 h-full flex flex-col border-b lg:border-b-0 lg:border-r border-slate-800 transition-all duration-200">
      <div class="bg-slate-900 px-3 py-1.5 border-b border-slate-800 text-xs text-slate-400 flex justify-between items-center shrink-0">
        <span class="flex items-center space-x-2 font-mono text-[11px] md:text-xs text-slate-300">
          <i class="fa-solid fa-code text-sky-400"></i>
          <span>main.py</span>
        </span>
        <span id="editor-line-col" class="text-slate-500 text-[10px] md:text-[11px] font-mono">Ln 1, Col 1</span>
      </div>
      <div id="monaco-editor" class="flex-1 w-full bg-slate-950 overflow-hidden"></div>
    </div>

    <!-- RIGHT PANEL: TERMINAL OUTPUT & TURTLE CANVAS -->
    <div id="panel-output" class="w-full lg:w-1/2 h-full bg-slate-950 flex flex-col overflow-y-auto hidden lg:flex transition-all duration-200">
      
      <!-- Optional Turtle Canvas Container -->
      <div id="turtle-container" class="hidden bg-slate-900 border-b border-slate-800 p-3 flex flex-col items-center justify-center shrink-0">
        <div class="w-full flex items-center justify-between text-xs text-slate-400 pb-2 border-b border-slate-800 mb-2 font-mono">
          <span class="flex items-center gap-1.5">
            <i class="fa-solid fa-[#0284c7] fa-compass text-sky-400"></i>
            <span>Turtle Canvas Screen</span>
          </span>
          <button onclick="hideTurtleScreen()" class="text-slate-500 hover:text-slate-300 transition text-xs">
            <i class="fa-solid fa-xmark"></i> Close Canvas
          </button>
        </div>
        <div id="turtle-canvas" class="bg-white rounded-lg p-2 border border-slate-700 shadow-xl overflow-hidden max-w-full"></div>
      </div>

      <!-- Terminal Screen -->
      <div class="flex-1 flex flex-col p-3 font-mono text-xs md:text-sm overflow-hidden select-text">
        <div class="flex items-center justify-between border-b border-slate-800 pb-1.5 mb-2 text-slate-400 text-[11px] shrink-0">
          <span class="flex items-center gap-1.5">
            <i class="fa-solid fa-terminal text-sky-400"></i>
            <span>Console Output</span>
          </span>
          <button onclick="clearConsole()" class="text-slate-500 hover:text-slate-300 transition" title="Clear Terminal">
            <i class="fa-solid fa-ban"></i>
          </button>
        </div>
        <pre id="console-output" class="flex-1 overflow-y-auto text-sky-400 whitespace-pre-wrap break-words leading-relaxed">Engine Ready! Instant Execution (~200KB Skulpt Interpreter Loaded).
Click 'Run' to execute code instantly.</pre>
        
        <!-- Status Bar -->
        <div class="mt-2 pt-1.5 border-t border-slate-900 text-[10px] md:text-[11px] text-slate-500 flex justify-between shrink-0 font-mono">
          <span id="status-text">Status: Ready</span>
          <span id="exec-time">Time: -</span>
        </div>
      </div>

    </div>

  </div>

  <!-- Monaco Editor Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>

  <script>
    let monacoEditor;

    const templates = {
      hello: `# Skulpt Lightweight Python 3 Engine
name = "Jarvis"
print(f"Hello, {name}!")
print("This lightweight engine compiles in milliseconds!")

numbers = [1, 2, 3, 4, 5]
squares = [x**2 for x in numbers]
print("Squares:", squares)`,

      loops: `# Mathematical Calculations & Loops
import math

print("=== Factorial and Trigonometry ===")
for i in range(1, 6):
    fact = math.factorial(i)
    sin_val = round(math.sin(i), 4)
    print(f"Number: {i} | Factorial: {fact} | Sin: {sin_val}")`,

      functions: `# Functions & Data Structures
def calculate_grade(score):
    if score >= 90:
        return "A+"
    elif score >= 75:
        return "A"
    elif score >= 60:
        return "B"
    else:
        return "C"

students = [
    {"name": "Alice", "score": 92},
    {"name": "Bob", "score": 78},
    {"name": "Charlie", "score": 64}
]

print("=== Student Grades ===")
for student in students:
    grade = calculate_grade(student["score"])
    print(f"{student['name']}: Score {student['score']} -> Grade {grade}")`,

      turtle: `# Skulpt Turtle Graphics Demo
import turtle

t = turtle.Turtle()
t.speed(5)
t.color("blue")

for i in range(4):
    t.forward(100)
    t.right(90)

print("Square drawn successfully on Turtle Canvas!")`
    };

    // Initialize Monaco Code Editor
    require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs' }});
    require(['vs/editor/editor.main'], function() {
      monacoEditor = monaco.editor.create(document.getElementById('monaco-editor'), {
        value: templates.hello,
        language: 'python',
        theme: 'vs-dark',
        automaticLayout: true,
        fontSize: window.innerWidth < 768 ? 12 : 14,
        minimap: { enabled: window.innerWidth > 1024 },
        fontFamily: "'Fira Code', Consolas, 'Courier New', monospace",
        padding: { top: 10 }
      });

      monacoEditor.onDidChangeCursorPosition(e => {
        document.getElementById('editor-line-col').innerText = `Ln ${e.position.lineNumber}, Col ${e.position.column}`;
      });

      window.addEventListener('resize', () => { if (monacoEditor) monacoEditor.layout(); });
    });

    // Theme Selector
    document.getElementById('theme-select').addEventListener('change', e => {
      monaco.editor.setTheme(e.target.value);
    });

    // Template Selector
    document.getElementById('snippet-select').addEventListener('change', e => {
      const val = e.target.value;
      if (templates[val] && monacoEditor) {
        monacoEditor.setValue(templates[val]);
        if (val === 'turtle') {
          document.getElementById('turtle-container').classList.remove('hidden');
        } else {
          document.getElementById('turtle-container').classList.add('hidden');
        }
      }
    });

    // Mobile Switcher
    function switchMobileTab(tab) {
      const editorPanel = document.getElementById('panel-editor');
      const outputPanel = document.getElementById('panel-output');
      const tabCode = document.getElementById('tab-code');
      const tabOutput = document.getElementById('tab-output');

      if (tab === 'code') {
        editorPanel.classList.remove('hidden');
        outputPanel.classList.add('hidden');
        tabCode.className = "px-2.5 py-1 rounded-md bg-sky-600 text-white font-medium transition";
        tabOutput.className = "px-2.5 py-1 rounded-md text-slate-400 hover:text-white transition";
      } else {
        editorPanel.classList.add('hidden');
        outputPanel.classList.remove('hidden');
        outputPanel.classList.add('flex');
        tabOutput.className = "px-2.5 py-1 rounded-md bg-sky-600 text-white font-medium transition";
        tabCode.className = "px-2.5 py-1 rounded-md text-slate-400 hover:text-white transition";
      }

      if (monacoEditor) monacoEditor.layout();
    }

    function clearConsole() {
      document.getElementById('console-output').innerText = "";
      document.getElementById('status-text').innerText = "Status: Cleared";
      document.getElementById('exec-time').innerText = "Time: -";
    }

    function hideTurtleScreen() {
      document.getElementById('turtle-container').classList.add('hidden');
    }

    // Skulpt Print Capture Output Stream
    function outf(text) {
      const outputArea = document.getElementById('console-output');
      outputArea.innerText += text;
    }

    // Skulpt Module Loader
    function builtinRead(x) {
      if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined) {
        throw "File not found: '" + x + "'";
      }
      return Sk.builtinFiles["files"][x];
    }

    // Run Python Code via Skulpt Engine
    function runSkulptPython() {
      const consoleOut = document.getElementById('console-output');
      const runBtn = document.getElementById('run-btn');
      const runIcon = document.getElementById('run-icon');
      const runText = document.getElementById('run-text');
      const statusText = document.getElementById('status-text');
      const execTime = document.getElementById('exec-time');

      const code = monacoEditor.getValue();

      if (window.innerWidth < 1024) {
        switchMobileTab('output');
      }

      runBtn.disabled = true;
      runIcon.className = "fa-solid fa-spinner fa-spin text-[10px]";
      runText.innerText = "Running";
      consoleOut.innerText = "";
      consoleOut.className = "flex-1 overflow-y-auto text-sky-400 whitespace-pre-wrap break-words leading-relaxed select-text";
      statusText.innerText = "Status: Running...";

      if (code.includes('import turtle')) {
        document.getElementById('turtle-container').classList.remove('hidden');
        document.getElementById('turtle-canvas').innerHTML = "";
      }

      const startTime = performance.now();

      Sk.configure({
        output: outf,
        read: builtinRead,
        python3: true,
        targetpane: "turtle-canvas"
      });

      (Sk.TurtleGraphics || (Sk.TurtleGraphics = {})).target = 'turtle-canvas';

      Sk.misceval.asyncToPromise(function() {
        return Sk.importMainWithBody("<stdin>", false, code, true);
      }).then(function() {
        const endTime = performance.now();
        const duration = ((endTime - startTime) / 1000).toFixed(3);

        if (!consoleOut.innerText) {
          consoleOut.innerText = "Program completed with code 0 (No Output).";
        }

        statusText.innerText = "Status: Success";
        execTime.innerText = `Time: ${duration}s`;

      }).catch(function(err) {
        const endTime = performance.now();
        const duration = ((endTime - startTime) / 1000).toFixed(3);

        consoleOut.innerText += "\n[Error]: " + err.toString();
        consoleOut.className = "flex-1 overflow-y-auto text-red-400 whitespace-pre-wrap break-words leading-relaxed select-text";

        statusText.innerText = "Status: Execution Error";
        execTime.innerText = `Time: ${duration}s`;

      }).finally(function() {
        runBtn.disabled = false;
        runIcon.className = "fa-solid fa-play text-[10px]";
        runText.innerText = "Run";
      });
    }

    // Export Python Source File
    function downloadCode() {
      const code = monacoEditor.getValue();
      const blob = new Blob([code], { type: 'text/x-python' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'main.py';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
