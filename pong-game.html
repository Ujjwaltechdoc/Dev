<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        h1 {
            color: white;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        #gameCanvas {
            background: #1a1a2e;
            border: 3px solid white;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            display: block;
        }

        .scoreboard {
            display: flex;
            gap: 80px;
            color: white;
            font-size: 1.8em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .player-score, .computer-score {
            text-align: center;
            min-width: 100px;
        }

        .player-score label, .computer-score label {
            display: block;
            font-size: 0.7em;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        .controls {
            color: white;
            text-align: center;
            font-size: 0.9em;
            opacity: 0.8;
            margin-top: 10px;
        }

        .reset-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 30px;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .reset-button:hover {
            background: #764ba2;
        }

        .info {
            color: white;
            text-align: center;
            font-size: 0.85em;
            opacity: 0.7;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎮 PONG GAME</h1>
        
        <div class="scoreboard">
            <div class="player-score">
                <label>Player</label>
                <div id="playerScore">0</div>
            </div>
            <div class="computer-score">
                <label>Computer</label>
                <div id="computerScore">0</div>
            </div>
        </div>

        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <div class="controls">
            <p>👆 <strong>Arrow Keys UP/DOWN</strong> or <strong>Move Mouse</strong> to control left paddle</p>
        </div>

        <button class="reset-button" onclick="resetGame()">Reset Game</button>

        <div class="info">
            <p>First to 11 points wins!</p>
        </div>
    </div>

    <script>
        // Canvas and context
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game constants
        const PADDLE_WIDTH = 10;
        const PADDLE_HEIGHT = 80;
        const BALL_SIZE = 8;
        const BALL_SPEED = 5;
        const PADDLE_SPEED = 6;
        const COMPUTER_SPEED = 4.5;

        // Game objects
        let playerPaddle = {
            x: 15,
            y: canvas.height / 2 - PADDLE_HEIGHT / 2,
            width: PADDLE_WIDTH,
            height: PADDLE_HEIGHT,
            dy: 0
        };

        let computerPaddle = {
            x: canvas.width - 25,
            y: canvas.height / 2 - PADDLE_HEIGHT / 2,
            width: PADDLE_WIDTH,
            height: PADDLE_HEIGHT,
            dy: 0
        };

        let ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            size: BALL_SIZE,
            dx: BALL_SPEED,
            dy: BALL_SPEED
        };

        let score = {
            player: 0,
            computer: 0
        };

        // Input handling
        const keys = {};
        let mouseY = canvas.height / 2;

        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        document.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseY = e.clientY - rect.top;
        });

        // Update player paddle position
        function updatePlayerPaddle() {
            // Mouse control
            playerPaddle.y = mouseY - PADDLE_HEIGHT / 2;

            // Keyboard control (can also be used together with mouse)
            if (keys['ArrowUp']) {
                playerPaddle.y -= PADDLE_SPEED;
            }
            if (keys['ArrowDown']) {
                playerPaddle.y += PADDLE_SPEED;
            }

            // Boundary collision for player paddle
            if (playerPaddle.y < 0) {
                playerPaddle.y = 0;
            }
            if (playerPaddle.y + playerPaddle.height > canvas.height) {
                playerPaddle.y = canvas.height - playerPaddle.height;
            }
        }

        // Update computer paddle (AI)
        function updateComputerPaddle() {
            const paddleCenter = computerPaddle.y + computerPaddle.height / 2;
            
            if (paddleCenter < ball.y - 35) {
                computerPaddle.y += COMPUTER_SPEED;
            } else if (paddleCenter > ball.y + 35) {
                computerPaddle.y -= COMPUTER_SPEED;
            }

            // Boundary collision for computer paddle
            if (computerPaddle.y < 0) {
                computerPaddle.y = 0;
            }
            if (computerPaddle.y + computerPaddle.height > canvas.height) {
                computerPaddle.y = canvas.height - computerPaddle.height;
            }
        }

        // Update ball position
        function updateBall() {
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Top and bottom wall collision
            if (ball.y - ball.size < 0) {
                ball.y = ball.size;
                ball.dy = -ball.dy;
            }
            if (ball.y + ball.size > canvas.height) {
                ball.y = canvas.height - ball.size;
                ball.dy = -ball.dy;
            }

            // Paddle collision - Player paddle
            if (ball.x - ball.size < playerPaddle.x + playerPaddle.width &&
                ball.y > playerPaddle.y &&
                ball.y < playerPaddle.y + playerPaddle.height) {
                
                ball.x = playerPaddle.x + playerPaddle.width + ball.size;
                ball.dx = -ball.dx;
                
                // Add spin based on where ball hits paddle
                let deltaY = ball.y - (playerPaddle.y + playerPaddle.height / 2);
                ball.dy = deltaY * 0.1;
            }

            // Paddle collision - Computer paddle
            if (ball.x + ball.size > computerPaddle.x &&
                ball.y > computerPaddle.y &&
                ball.y < computerPaddle.y + computerPaddle.height) {
                
                ball.x = computerPaddle.x - ball.size;
                ball.dx = -ball.dx;
                
                // Add spin based on where ball hits paddle
                let deltaY = ball.y - (computerPaddle.y + computerPaddle.height / 2);
                ball.dy = deltaY * 0.1;
            }

            // Ball out of bounds - Player scores
            if (ball.x + ball.size > canvas.width) {
                score.player++;
                document.getElementById('playerScore').textContent = score.player;
                resetBall();
            }

            // Ball out of bounds - Computer scores
            if (ball.x - ball.size < 0) {
                score.computer++;
                document.getElementById('computerScore').textContent = score.computer;
                resetBall();
            }
        }

        // Reset ball to center
        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.dx = BALL_SPEED * (Math.random() > 0.5 ? 1 : -1);
            ball.dy = BALL_SPEED * (Math.random() > 0.5 ? 1 : -1);
        }

        // Reset game
        function resetGame() {
            score.player = 0;
            score.computer = 0;
            document.getElementById('playerScore').textContent = '0';
            document.getElementById('computerScore').textContent = '0';
            resetBall();
        }

        // Draw functions
        function drawRect(x, y, width, height, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, width, height);
        }

        function drawCircle(x, y, size, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawDottedLine() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.setLineDash([10, 10]);
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function draw() {
            // Clear canvas
            drawRect(0, 0, canvas.width, canvas.height, '#1a1a2e');

            // Draw center line
            drawDottedLine();

            // Draw paddles
            drawRect(playerPaddle.x, playerPaddle.y, playerPaddle.width, playerPaddle.height, '#00d4ff');
            drawRect(computerPaddle.x, computerPaddle.y, computerPaddle.width, computerPaddle.height, '#ff006e');

            // Draw ball
            drawCircle(ball.x, ball.y, ball.size, '#ffbe0b');
        }

        // Game loop
        function gameLoop() {
            updatePlayerPaddle();
            updateComputerPaddle();
            updateBall();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start game
        gameLoop();
    </script>
</body>
</html>
